[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lnfnt-a2a"
version = "0.1.1"
description = "Agent-to-agent file-bus CLI for AI agent teams: mail, journal, tasks, locks, alerts, RPC over shared storage"
readme = "README.md"
authors = [{ name = "lnfnt", email = "lnfnt@proton.me" }]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
a2a = "a2a.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["a2a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
